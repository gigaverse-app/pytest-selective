name: Explain global pytest expansion
description: Reject unexplained conftest expansion before dependency setup or test allocation; uses the caller's checkout and Python.
inputs:
  python-executable:
    description: Python interpreter at least as new as the inspected source syntax.
    default: python3.14
  base:
    description: Full PR base or push-before ref; never an incremental test-selection baseline.
    required: true
  head:
    description: Checked-out commit to inspect.
    default: HEAD
  module-roots:
    description: Space-separated Python source roots, in import order.
    default: '.'
  project-import-prefixes:
    description: Space-separated application/test module prefixes requiring reasons for new imports.
    required: true
  follow-import-prefixes:
    description: Space-separated helper/plugin module prefixes to check transitively when loaded.
    default: ''
runs:
  using: composite
  steps:
    - name: Check global pytest expansion
      shell: bash
      env:
        EXPANSION_PYTHON: ${{ inputs.python-executable }}
        EXPANSION_BASE: ${{ inputs.base }}
        EXPANSION_HEAD: ${{ inputs.head }}
        EXPANSION_MODULE_ROOTS: ${{ inputs.module-roots }}
        EXPANSION_PROJECT_PREFIXES: ${{ inputs.project-import-prefixes }}
        EXPANSION_FOLLOW_PREFIXES: ${{ inputs.follow-import-prefixes }}
        SHARED_ACTION_PATH: ${{ github.action_path }}
      run: |
        # No install, checkout, or fail-open fallback: missing history is an error.
        args=(--repo "$GITHUB_WORKSPACE" --base "$EXPANSION_BASE" --head "$EXPANSION_HEAD")
        read -r -a roots <<< "$EXPANSION_MODULE_ROOTS"
        read -r -a projects <<< "$EXPANSION_PROJECT_PREFIXES"
        read -r -a helpers <<< "$EXPANSION_FOLLOW_PREFIXES"
        for root in "${roots[@]}"; do args+=(--module-root "$root"); done
        for prefix in "${projects[@]}"; do args+=(--project-import-prefix "$prefix"); done
        for prefix in "${helpers[@]}"; do args+=(--follow-import-prefix "$prefix"); done
        "$EXPANSION_PYTHON" "$SHARED_ACTION_PATH/../../src/pytest_selective/pytest_expansion.py" "${args[@]}"
