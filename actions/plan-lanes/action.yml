name: Select complete test lanes
description: Skip unaffected CI lanes while preserving complete conformance runs and full-suite fallbacks.
inputs:
  config:
    description: Repository-owned lane and dependency graph configuration.
    required: true
  base:
    description: Base commit containing the complete change set.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  pr-head:
    description: >-
      The pull request's head. When the checkout is GitHub's merge of it (refs/pull/N/merge), changes are measured from
      that merge's base-branch parent, so commits that landed on the base branch after `base` are not counted as the PR's.
      Empty (any other event) keeps `base`.
    default: ${{ github.event.pull_request.head.sha }}
  full:
    description: 'auto preserves selection on PR/push reruns and runs full for manual/scheduled/release checkpoints or test:full. Override with true or false.'
    default: auto
  artifact-name:
    description: >
      Upload the lane plan (test-lanes.json) as an artifact under this name, where
      CI-esta's report renders it as the sticky's lane section. Give each planner job
      in one workflow run its own name. Empty skips the upload; planning and the
      outputs are unchanged.
    default: test-lane-selection
outputs:
  lanes:
    description: JSON object mapping lane names to booleans.
    value: ${{ steps.plan.outputs.lanes }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: false
    - uses: actions/cache@v5
      continue-on-error: true
      with:
        path: .test-impact
        key: pytest-selective-lanes-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: pytest-selective-lanes-${{ runner.os }}-
    - id: plan
      shell: bash
      env:
        SELECTIVE_ACTION: ${{ github.action_path }}
        SELECTIVE_CONFIG: ${{ inputs.config }}
        SELECTIVE_BASE: ${{ inputs.base }}
        SELECTIVE_FULL: ${{ inputs.full }}
        SELECTIVE_PR_HEAD: ${{ inputs.pr-head }}
      run: |
        export PYTHONPATH="$SELECTIVE_ACTION/../../src${PYTHONPATH:+:$PYTHONPATH}"
        args=(--config "$SELECTIVE_CONFIG" --base "$SELECTIVE_BASE" --github-output "$GITHUB_OUTPUT")
        args+=(--full "$SELECTIVE_FULL")
        if [ -n "$SELECTIVE_PR_HEAD" ]; then args+=(--pr-head "$SELECTIVE_PR_HEAD"); fi
        uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 \
          python -m pytest_selective.ci "${args[@]}" | tee test-lanes.json
        {
          echo '### Test lane selection'
          echo '```json'
          cat test-lanes.json
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: test-lanes.json
        if-no-files-found: error
        # A rerun of the job replaces its plan instead of failing on the existing name.
        overwrite: true
