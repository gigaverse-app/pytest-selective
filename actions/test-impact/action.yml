name: Cached test impact selection
description: Select affected Python test files from both Git trees, falling back to all configured roots.
inputs:
  warm-only:
    description: Populate the checked-out merged-tree cache without selecting or running tests.
    default: 'false'
  config:
    description: Consumer-owned dependency graph configuration.
    required: true
  base:
    description: Complete change-set base (a validated ancestor, PR base, or push before SHA).
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  head:
    description: Exact checked-out commit.
    default: HEAD
  full-roots:
    description: Space-separated complete test roots used if planning cannot prove a narrower scope.
    required: true
  full:
    description: 'auto selects on PRs/pushes and runs full on reruns, manual/scheduled/release events or test:full. Override with true or false.'
    default: auto
  extra-files:
    description: Optional newline file containing prior failure canaries or additional changed paths.
    default: ''
  alternate-base:
    description: >-
      A second proven base, normally the PR base when `base` is a previously validated tree.
      Both are selected and the smaller selection wins: after main is merged into a validated
      PR, the delta since that tree carries main's own changes and can reach every test.
    default: ''
  alternate-extra-files:
    description: Newline file of extra paths for `alternate-base` (its unresolved failures and canaries).
    default: ''
  minimum-files:
    description: Minimum nonempty selection for consumers with fixed shard counts.
    default: '0'
  max-shards:
    description: Maximum parallel pytest processes.
    default: '8'
  durations:
    description: pytest-split duration manifest used to size the shard pool; absent or unreadable falls back to file-count sizing.
    default: '.test_durations'
  shard-seconds:
    description: Target wall time per shard. Shard count is the selected work divided by this, bounded by max-shards.
    default: '120'
  dependency-token:
    description: >-
      Read access to the repositories of first-party packages declared in `first_party_packages`.
      With it, a lock change that only moves such a pin selects the tests reaching the modules that
      moved instead of every test. Without it, or when the fetch fails, lock changes stay global.
    default: ''
  explanation-artifact:
    description: >-
      Artifact name for why the selection is this large, which the ci-observability action renders
      into the PR sticky. Writing it never changes the selection. Empty skips the upload.
    default: test-impact-explanation
  graph-base:
    description: >-
      The PR's base commit. The explanation measures startup-floor and blast-radius changes from
      its merge base with `head`, so they stay visible after `base` moves to a validated tree.
      Without it, or without the history, they compare against `base`.
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  base:
    value: ${{ steps.select.outputs.base }}
    description: The base the selection was made from; `alternate-base` when it selected fewer tests.
  mode:
    value: ${{ steps.select.outputs.mode }}
    description: full, scoped, or none.
  test_roots:
    value: ${{ steps.select.outputs.test_roots }}
    description: Exact selected files, or complete roots on fallback.
  test_roots_json:
    value: ${{ steps.select.outputs.test_roots_json }}
    description: JSON array of selected files or fallback roots; preserves spaces in paths. Empty array for none.
  shard_count:
    value: ${{ steps.select.outputs.shard_count }}
    description: Number of shards.
  groups:
    value: ${{ steps.select.outputs.groups }}
    description: JSON shard indexes.
  reason:
    value: ${{ steps.select.outputs.reason }}
    description: Selection summary.
  dependencies-unchanged:
    value: ${{ steps.select.outputs.dependencies_unchanged }}
    description: >-
      'true' only when every declared first-party lock and manifest is unchanged, or differs only
      by pins whose installed files are byte-identical. Lanes that treat a lock change as "every
      runtime changed" may skip on it. 'false' on any doubt, including every fallback.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - name: Restore parsed imports and resolved graphs
      id: graph-cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .test-impact
        key: test-impact-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          test-impact-v1-${{ runner.os }}-
    - name: Select affected files
      id: select
      shell: bash
      env:
        IMPACT_WARM_ONLY: ${{ inputs.warm-only }}
        IMPACT_CONFIG: ${{ inputs.config }}
        IMPACT_BASE: ${{ inputs.base }}
        IMPACT_HEAD: ${{ inputs.head }}
        IMPACT_FULL: ${{ inputs.full }}
        IMPACT_EXTRA: ${{ inputs.extra-files }}
        IMPACT_ALTERNATE_BASE: ${{ inputs.alternate-base }}
        IMPACT_ALTERNATE_EXTRA: ${{ inputs.alternate-extra-files }}
        IMPACT_ROOTS: ${{ inputs.full-roots }}
        IMPACT_MINIMUM: ${{ inputs.minimum-files }}
        IMPACT_SHARDS: ${{ inputs.max-shards }}
        IMPACT_DURATIONS: ${{ inputs.durations }}
        IMPACT_SHARD_SECONDS: ${{ inputs.shard-seconds }}
        # Environment only: the CLI never takes it on argv, and git gets it per process, not in config.
        IMPACT_DEPENDENCY_TOKEN: ${{ inputs.dependency-token }}
        IMPACT_GRAPH_BASE: ${{ inputs.graph-base }}
        SHARED_ACTION_PATH: ${{ github.action_path }}
      run: |
        export PYTHONPATH="$SHARED_ACTION_PATH/../../src${PYTHONPATH:+:$PYTHONPATH}"
        # Both modes must use the same isolated parser runtime, including YAML sidecars.
        impact=(uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 python -m pytest_selective.impact_cli)
        if [ "${IMPACT_WARM_ONLY:-false}" = true ]; then
          if "${impact[@]}" warm --config "$IMPACT_CONFIG" --head "$IMPACT_HEAD"; then
            echo "Merged-tree test impact cache is ready" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Test impact cache warming failed; future runs will rebuild it"
          fi
          exit 0
        fi
        args=(affected --config "$IMPACT_CONFIG" --base "$IMPACT_BASE" --head "$IMPACT_HEAD"
              --max-shards "$IMPACT_SHARDS" --minimum-files "$IMPACT_MINIMUM" --github-output "$GITHUB_OUTPUT" --output test-impact-report.json
              --durations "$IMPACT_DURATIONS" --shard-seconds "$IMPACT_SHARD_SECONDS"
              --explanation-output test-impact-explanation.json)
        # A reused workspace must not upload a previous plan's explanation.
        rm -f test-impact-explanation.json
        args+=(--full "$IMPACT_FULL")
        if [ -n "$IMPACT_EXTRA" ]; then args+=(--extra-files "$IMPACT_EXTRA"); fi
        if [ -n "${IMPACT_GRAPH_BASE:-}" ]; then args+=(--graph-base "$IMPACT_GRAPH_BASE"); fi
        # Optional: an unfetchable alternate only forgoes a smaller selection.
        if [ -n "${IMPACT_ALTERNATE_BASE:-}" ] && [ "$IMPACT_FULL" != true ] &&
          git fetch --no-tags --depth=1 origin "$IMPACT_ALTERNATE_BASE"; then
          args+=(--alternate-base "$IMPACT_ALTERNATE_BASE")
          if [ -n "${IMPACT_ALTERNATE_EXTRA:-}" ]; then args+=(--alternate-extra-files "$IMPACT_ALTERNATE_EXTRA"); fi
        fi
        if [ -n "$IMPACT_BASE" ] && git fetch --no-tags --depth=1 origin "$IMPACT_BASE" &&
          "${impact[@]}" "${args[@]}"; then
          python3 - <<'PY'
        import json, os
        from pathlib import Path
        report = json.loads(Path("test-impact-report.json").read_text())
        summary = f"Test impact: {len(report['selected'])}/{report['total_files']} files; {report['mode']}; {report['elapsed_seconds']:.2f}s planning"
        print(summary)
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
            output.write(summary + "\n")
        PY
        else
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::Invalid test dependency or unparseable Python; fix the reported reader and path"
            exit 2
          fi
          echo "::warning::Test impact proof unavailable; running all configured test roots"
          {
            echo "base=$IMPACT_BASE"
            echo "mode=full"
            echo "test_roots=$IMPACT_ROOTS"
            echo "test_roots_json=$(python3 -c 'import json,os,shlex; print(json.dumps(shlex.split(os.environ["IMPACT_ROOTS"])))')"
            echo "shard_count=$IMPACT_SHARDS"
            echo "groups=$(python3 -c 'import json,os; print(json.dumps(list(range(1,int(os.environ["IMPACT_SHARDS"])+1))))')"
            echo "reason=Test impact proof unavailable; complete suite fallback"
            echo "dependencies_unchanged=false"
          } >> "$GITHUB_OUTPUT"
          # Replaces an earlier attempt's explanation, which describes a plan this attempt did not run.
          echo '{"unavailable": "Test impact proof unavailable; complete suite fallback"}' > test-impact-explanation.json
        fi
    # A successful plan uploads its explanation; a fallback uploads the marker that replaces one.
    - name: Upload selection explanation
      if: ${{ inputs.warm-only != 'true' && inputs.explanation-artifact != '' && hashFiles('test-impact-explanation.json') != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.explanation-artifact }}
        path: test-impact-explanation.json
        overwrite: true
        retention-days: 7
    - name: Save graph cache
      if: ${{ steps.graph-cache.outputs.cache-hit != 'true' && hashFiles('.test-impact/cache.sqlite3') != '' }}
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .test-impact
        key: test-impact-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
    # Last, so a failure here costs neither the explanation upload nor the cache: it fails the plan
    # when this PR grows the startup floor past the config's `floor_budget` (no budget, no check).
    - name: Check the startup-floor budget
      if: ${{ inputs.warm-only != 'true' && hashFiles('test-impact-explanation.json') != '' }}
      shell: bash
      env:
        IMPACT_CONFIG: ${{ inputs.config }}
        SHARED_ACTION_PATH: ${{ github.action_path }}
      run: |
        export PYTHONPATH="$SHARED_ACTION_PATH/../../src${PYTHONPATH:+:$PYTHONPATH}"
        uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 \
          python -m pytest_selective.impact_cli floor-budget \
          --config "$IMPACT_CONFIG" --explanation test-impact-explanation.json
