site_name: pytest-selective
site_description: Run affected Python tests safely, explain every selection, and skip
  unrelated CI lanes.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://pytest-selective.readthedocs.io/en/latest/"]
repo_url: https://github.com/gigaverse-app/pytest-selective
repo_name: gigaverse-app/pytest-selective
edit_uri: ''
docs_dir: documentation
site_dir: site
strict: true
exclude_docs: '*.py

  *.txt

  *.in

  overrides/

  '
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  custom_dir: documentation/overrides
  language: en
  font: false
  # Follow the reader's system theme; the header toggle overrides it.
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: cyan
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
hooks:
- documentation/hooks.py
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.details
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra:
  # Copied verbatim into the built site for agents and crawlers (documentation/hooks.py on_post_build).
  raw_files:
    skills/pytest-selective/SKILL.md: agent-setup.md
  llms_txt: documentation/llms.txt
  published_sources:
  - source: skills/pytest-selective/SKILL.md
    as: agent-setup.md
  - docs/tutorials/adoption-checklist.md
  - docs/tutorials/skip-unrelated-ci.md
  - docs/tutorials/sidecar-dependencies.md
  - docs/actions.md
  - docs/agents.md
  - docs/benchmarks/2026-10-22-routing.md
  - docs/benchmarks/2026-10-22.md
  - docs/benchmarks/2026-10-23-windows-saleor.md
  - docs/benchmarks/windows-runtime.md
  - docs/ci-toolkit.md
  - docs/ci.md
  - docs/comparison-pytest-impacted.md
  - docs/configuration.md
  - docs/evidence.md
  - docs/local-development.md
  - docs/pytest-hygiene.md
  - docs/selection-health.md
  - docs/tutorial.md
  - CONTRIBUTING.md
  - RELEASING.md
nav:
- Home: index.md
- Getting started:
  - Set it up with a coding agent: agent-setup.md
  - Quickstart: docs/tutorial.md
  - Adoption tutorial and checklist: docs/tutorials/adoption-checklist.md
  - Run affected tests locally: docs/local-development.md
  - Declare file inputs with sidecars: docs/tutorials/sidecar-dependencies.md
  - Skip unrelated CI jobs safely: docs/tutorials/skip-unrelated-ci.md
  - Agent prompt and skill installation: docs/agents.md
- Configure and run:
  - Configuration reference: docs/configuration.md
  - Set up CI selection: docs/ci.md
  - GitHub Actions reference: docs/actions.md
- Keep selection trustworthy:
  - Guarantees and limits: docs/evidence.md
  - Diagnose broad selections: docs/selection-health.md
  - Keep fixtures and plugins isolated: docs/pytest-hygiene.md
- Benchmarks and evidence:
  - "From the trenches: two backends, thirty thousand tests": case-study.md
  - Docs-only CI routing savings: docs/benchmarks/2026-10-22-routing.md
  - Due and obligation selection results: docs/benchmarks/2026-10-22.md
  - Windows and Saleor critical-path fixes: docs/benchmarks/2026-10-23-windows-saleor.md
  - Windows Git runtime measurements: docs/benchmarks/windows-runtime.md
- Compare and combine tools:
  - Related tools: ecosystem.md
  - Compare with pytest-impacted: docs/comparison-pytest-impacted.md
- Contributing:
  - Development setup: CONTRIBUTING.md
  - This project's CI toolkit: docs/ci-toolkit.md
  - Releasing: RELEASING.md
  - Documentation publishing: publishing.md
