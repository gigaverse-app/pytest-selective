repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (uv.lock)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: docs-links
        name: Local Markdown links
        entry: uv run --locked python scripts/check_docs.py
        language: system
        pass_filenames: false
        types: [markdown]
