minimum_pre_commit_version: '4.3.0'
default_install_hook_types: [pre-commit, prepare-commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (uv.lock)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: docs-links
        name: Local Markdown links
        entry: uv run --locked python scripts/check_docs.py
        language: system
        pass_filenames: false
        types: [markdown]

  - repo: https://github.com/gigaverse-app/dry-lint
    rev: v1
    hooks:
      - id: dry-lint
        args: [--preset, sonnet, --baseline, .dry-lint/baseline.json]
        language_version: python3.13
      - id: dry-lint-trailers
        language_version: python3.13
