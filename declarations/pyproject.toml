[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "selective-deps"
version = "1.7.1"
description = "Portable file dependency declarations for test selection and incremental tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Gigaverse"}]
dependencies = ["pydantic>=2.11,<3", "pyyaml>=6,<7"]

[project.urls]
Repository = "https://github.com/gigaverse-app/pytest-selective"
Documentation = "https://pytest-selective.readthedocs.io/en/latest/docs/declarations/"

[tool.hatch.build.targets.wheel]
packages = ["src/selective_deps"]
