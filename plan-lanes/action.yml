# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Select complete test lanes
description: Skip unaffected CI lanes while preserving complete conformance runs and full-suite fallbacks.
inputs:
  config:
    description: Repository-owned lane and dependency graph configuration.
    required: true
  base:
    description: Base commit containing the complete change set.
    required: true
  full:
    description: Run every lane for main, schedules, or an explicit full-test request.
    default: 'false'
  artifact-name:
    description: 'Upload the lane plan under this name, where CI-esta''s report renders it as the sticky''s lane section.
      Empty skips the upload.

      '
    default: test-lane-selection
outputs:
  lanes:
    description: JSON object mapping lane names to booleans.
    value: ${{ steps.action.outputs.lanes }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/plan-lanes
    with:
      config: ${{ inputs.config }}
      base: ${{ inputs.base }}
      full: ${{ inputs.full }}
      artifact-name: ${{ inputs.artifact-name }}
