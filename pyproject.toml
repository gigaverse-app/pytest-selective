[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-selective"
version = "0.1.0a1"
description = "Explainable Git-based test selection for Python, extracted from Gigaverse CI"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Gigaverse"}]
dependencies = ["pydantic>=2.11,<3", "pyyaml>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
audit = ["pytest>=8"]

[project.scripts]
pytest-selective = "pytest_selective.impact_cli:main"

[project.urls]
Repository = "https://github.com/gigaverse-app/pytest-selective"
Issues = "https://github.com/gigaverse-app/pytest-selective/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "pytest-timeout>=2.3", "ruff>=0.14", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_selective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
