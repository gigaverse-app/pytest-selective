# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Explain global pytest expansion
description: Reject unexplained conftest expansion before dependency setup or test allocation; uses the caller's checkout
  and Python.
inputs:
  python-executable:
    description: Python interpreter at least as new as the inspected source syntax.
    default: python3.14
  base:
    description: Full PR base or push-before ref; never an incremental test-selection baseline.
    required: true
  head:
    description: Checked-out commit to inspect.
    default: HEAD
  module-roots:
    description: Space-separated Python source roots, in import order.
    default: .
  project-import-prefixes:
    description: Space-separated application/test module prefixes requiring reasons for new imports.
    required: true
  follow-import-prefixes:
    description: Space-separated helper/plugin module prefixes to check transitively when loaded.
    default: ''
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/pytest-expansion
    with:
      python-executable: ${{ inputs.python-executable }}
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      module-roots: ${{ inputs.module-roots }}
      project-import-prefixes: ${{ inputs.project-import-prefixes }}
      follow-import-prefixes: ${{ inputs.follow-import-prefixes }}
