version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
