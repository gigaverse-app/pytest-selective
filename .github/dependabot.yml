version: 2
updates:
  - package-ecosystem: github-actions
    # The published composite actions pin commit SHAs with `# vX.Y.Z` comments; update them too.
    directories: [/, /actions/*]
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
