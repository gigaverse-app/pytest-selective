name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
      - name: Require a version-matching tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-project python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_REF"] == f"refs/tags/v{version}", "Run publishing from the version-matching v tag"'
  checks:
    needs: validate-tag
    # Reusable CI's Quint report requests this grant, even on a tag with no PR.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-selective/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish tested distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1

  action-version:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Advance the compatible Actions tag after publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            exit 0
          fi
          # The Actions API has its own major, independent of the Python package.
          alias="v1"
          if gh api "repos/$GH_REPO/git/ref/tags/$alias" --silent; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$alias" \
              -f sha="$RELEASE_SHA" -F force=true --silent
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$alias" -f sha="$RELEASE_SHA" --silent
          fi
