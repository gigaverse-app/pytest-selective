name: Public action smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # This workflow smokes the repository's own actions, so its planner is plan-lanes itself, run selectively on every
      # change against .github/plan-lanes.json; CI's lanes come from CI-esta's plan-work.
      - id: select
        uses: ./actions/plan-lanes
        with:
          config: .github/plan-lanes.json
          artifact-name: public-action-selection
  public-actions:
    needs: select-tests
    if: >-
      ${{ !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use the reviewed repository graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('.github/plan-lanes.json').read_text())['graph']
          Path('smoke-impact.json').write_text(json.dumps(graph))
          PY
      - uses: ./
        id: impact
        with:
          config: smoke-impact.json
          base: ${{ github.sha }}
          full: 'true'
          full-roots: tests
          max-shards: '2'
          explanation-artifact: ''
      - name: Verify forwarded file-plan outputs
        env:
          MODE: ${{ steps.impact.outputs.mode }}
          ROOTS: ${{ steps.impact.outputs.test_roots }}
        run: |
          test "$MODE" = full
          test -n "$ROOTS"
      - uses: ./actions/plan-lanes
        id: lanes
        with:
          config: .github/plan-lanes.json
          base: ${{ github.sha }}
          full: 'true'
          artifact-name: ''
      - name: Verify forwarded lane outputs
        env:
          LANES: ${{ steps.lanes.outputs.lanes }}
        run: |
          python - <<'PY'
          import json, os
          # A full checkpoint admits every configured lane.
          configured = json.load(open('.github/plan-lanes.json', encoding='utf-8'))['lanes']
          assert json.loads(os.environ['LANES']) == dict.fromkeys(configured, True)
          PY
      - name: Require successful planning after fallback execution
        if: ${{ !cancelled() && needs.select-tests.result != 'success' }}
        run: exit 1
  gate:
    name: Public action gate
    needs: [select-tests, public-actions]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dogfood the public gate: the smoke may be skipped only when the successful plan said so.
      - uses: ./actions/validation-gate
        with:
          needs: ${{ toJSON(needs) }}
          lane-jobs: '{"public-actions":["tests"]}'
