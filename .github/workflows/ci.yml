name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Only newer revisions of the same PR supersede work; keep every main/manual run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      mode: ${{ steps.files.outputs.mode }}
      files: ${{ steps.paths.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        uses: ./actions/plan-lanes
        with:
          config: .github/test-lanes.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full: ${{ github.run_attempt > 1 || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
      - name: Share the repository graph and execution inputs with file selection
        env:
          PYTHONPATH: src
        run: |
          uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 \
            python scripts/ci_file_config.py "$RUNNER_TEMP/test-impact.json"
      - id: files
        uses: ./
        with:
          config: ${{ runner.temp }}/test-impact.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full-roots: tests
          full: ${{ github.run_attempt > 1 || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
      - id: paths
        name: Forward exact selected paths without shell splitting
        env:
          MODE: ${{ steps.files.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = json.loads(Path('test-impact-report.json').read_text())['selected'] if os.environ['MODE'] == 'scoped' else []
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('files=' + json.dumps(files) + '\n')
          PY
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
      - run: uv run --locked pre-commit run --all-files
      - name: Check aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta>=1.1.0,<2.0.0"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json
      - name: Validate routing even when the platform matrix is skipped
        run: uv run --locked pytest -q tests/test_repository_ci.py
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  tests:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: ${{ matrix.python }}
      - name: Use native Git for Windows
        uses: gigaverse-app/ci-esta/actions/native-windows-git@v1
      - name: Record coverage runtime
        run: uv run --locked python -m coverage --version
      - name: Execute the shared affected-file plan
        run: uv run --locked python scripts/run_ci_tests.py -q -n 4 --durations=20 --junitxml=test-timings.xml
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
          CI_COVERAGE: 'true'
          # Keep temporary Git repositories beside the checkout on the work disk.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
      - uses: gigaverse-app/ci-esta/actions/learn-test-timings@v1
        if: ${{ hashFiles('test-timings.xml') != '' }}
        with:
          junit-pattern: test-timings.xml
          artifact-name: test-timings-${{ matrix.python }}-${{ matrix.os }}
      - run: uv run --locked python scripts/tutorial.py --output tutorial-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            tutorial-report.json
  pytest-minimum:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.11'
      - run: uv pip install 'pytest==8.0.0'
      - name: Execute the same file plan on minimum pytest
        run: uv run --no-sync python scripts/run_ci_tests.py -q -n 4 --durations=20
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
  distributions:
    needs: select-tests
    # README changes still need build/metadata checks; planner failure must not skip them.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/check_metadata.py
      - name: Smoke installed distributions when runtime inputs change
        if: >-
          ${{ needs.select-tests.result != 'success' ||
              fromJSON(needs.select-tests.outputs.lanes).tests }}
        run: uv run --locked python scripts/smoke_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  validation-gate:
    name: Validation gate
    needs: [select-tests, quality, tests, pytest-minimum, distributions]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"tests":["tests"],"pytest-minimum":["tests"]}'
