name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Only newer revisions of the same PR supersede work; keep every main/manual run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/plan-lanes
        with:
          config: .github/test-lanes.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@78e5e2b078ce6d9b4df488a102c387f3548aa00a
        with:
          python-version: '3.14'
      - run: uv run --locked pre-commit run --all-files
      - name: Check aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta @ https://github.com/gigaverse-app/ci-esta/archive/78e5e2b078ce6d9b4df488a102c387f3548aa00a.tar.gz"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json
      - name: Validate routing even when the platform matrix is skipped
        run: uv run --locked pytest -q tests/test_repository_ci.py
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  tests:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@78e5e2b078ce6d9b4df488a102c387f3548aa00a
        with:
          python-version: ${{ matrix.python }}
      - name: Use native Git for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/use_native_windows_git.ps1
      - name: Record coverage runtime
        run: uv run --locked python -m coverage --version
      - run: uv run --locked pytest -q -n 4 --durations=20 --cov --cov-report=term-missing --cov-report=xml
      - run: uv run --locked python scripts/tutorial.py --output tutorial-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            tutorial-report.json
  pytest-minimum:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@78e5e2b078ce6d9b4df488a102c387f3548aa00a
        with:
          python-version: '3.11'
      - run: uv pip install 'pytest==8.0.0'
      - run: uv run --no-sync pytest -q -n 4 --durations=20
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@78e5e2b078ce6d9b4df488a102c387f3548aa00a
        with:
          python-version: '3.14'
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/check_metadata.py
      - run: uv run --locked python scripts/smoke_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  validation-gate:
    name: Validation gate
    needs: [select-tests, quality, tests, pytest-minimum, distributions]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/.github/actions/validation-gate@78e5e2b078ce6d9b4df488a102c387f3548aa00a
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"tests":["tests"],"pytest-minimum":["tests"]}'
