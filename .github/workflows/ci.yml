name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '13 3 * * 1'
permissions:
  contents: read
concurrency:
  # Only newer revisions of the same PR supersede work; keep every main/manual run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  select-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Receipts are completed steps of earlier runs' jobs.
      checks: read
      pull-requests: read
    env:
      # The jobs whose passing first attempts can prove the tests lane, by exact job name.
      TEST_LANE_JOBS: >-
        {"py311-ubuntu":"tests (3.11, ubuntu-latest)","py311-windows":"tests (3.11, windows-latest)",
        "py311-macos":"tests (3.11, macos-latest)","py314-ubuntu":"tests (3.14, ubuntu-latest)",
        "py314-windows":"tests (3.14, windows-latest)","py314-macos":"tests (3.14, macos-latest)",
        "minimum":"pytest-minimum"}
    outputs:
      # Planned lanes after reuse: the tests lane is false only when every one of its jobs is proven by a receipt.
      lanes: ${{ steps.admit.outputs.lanes }}
      # The plan before reuse, for steps that follow changed runtime inputs rather than test execution.
      planned: ${{ steps.plan.outputs.lanes }}
      mode: ${{ steps.files.outputs.mode }}
      files: ${{ steps.files.outputs.test_roots_json }}
      receipt: ${{ steps.evidence.outputs.receipt }}
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # GitHub often omits a run's pull_requests link. This marker binds the run to its PR and head, so the push
      # after a squash merge can use this run's receipts. CI-esta matches the exact name.
      - name: "PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
        run: 'true'
      - id: plan
        uses: ./actions/plan-lanes
        with:
          config: .github/test-lanes.json
      - name: Share the repository graph and execution inputs with file selection
        env:
          PYTHONPATH: src
        run: |
          uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 \
            python scripts/ci_file_config.py "$RUNNER_TEMP/test-impact.json"
      - id: files
        uses: ./
        with:
          config: ${{ runner.temp }}/test-impact.json
          full-roots: tests
      # Everything the tests lane executes or reads, bound into each receipt.
      - id: inputs
        run: echo "paths=$(jq -c . .github/validation-inputs.json)" >> "$GITHUB_OUTPUT"
      # CI-esta reuses a passing first attempt of the same job when its inputs and selected files are identical:
      # after a squash merge, on a version-only release PR, and on a PR push that changes nothing the tests read.
      # Release (workflow_call), schedules, manual runs and the test:full label always execute.
      - id: evidence
        if: >-
          ${{ (github.event_name == 'pull_request' || github.event_name == 'push') &&
              !contains(github.event.pull_request.labels.*.name, 'test:full') }}
        uses: gigaverse-app/ci-esta/actions/resolve-lane-evidence@v1
        with:
          lanes: ${{ env.TEST_LANE_JOBS }}
          execution-context: ${{ steps.files.outputs.mode }} ${{ steps.files.outputs.test_roots_json }}
          input-paths: ${{ steps.inputs.outputs.paths }}
          reuse-after-merge: 'true'
          reuse-version-only-release: 'true'
      - id: admit
        name: Admit the tests lane unless every job is proven
        env:
          LANES: ${{ steps.plan.outputs.lanes }}
          REUSED: ${{ steps.evidence.outputs.reused || '{}' }}
        run: |
          lanes=$(jq -c --argjson jobs "$TEST_LANE_JOBS" --argjson reused "$REUSED" 'if [$jobs | keys[] | $reused[.] == true] | all then .tests = false else . end' <<<"$LANES")
          echo "reused=$REUSED"
          echo "lanes=$lanes" | tee -a "$GITHUB_OUTPUT"
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
      # Semantic judging owns its credentials and fork boundary in the required dry-lint job.
      - run: uv run --locked pre-commit run --all-files
        env:
          SKIP: dry-lint
      - name: Check aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta>=1.1.0,<2.0.0"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
  tests:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: ${{ matrix.python }}
      - name: Use native Git for Windows
        uses: gigaverse-app/ci-esta/actions/native-windows-git@v1
      - name: Record coverage runtime
        run: uv run --locked python -m coverage --version
      - name: Execute the shared affected-file plan
        run: uv run --locked python scripts/run_ci_tests.py -q -n 4 --durations=20 --junitxml=test-timings.xml
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
          CI_COVERAGE: 'true'
          # Keep temporary Git repositories beside the checkout on the work disk.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
      - uses: gigaverse-app/ci-esta/actions/learn-test-timings@v1
        if: ${{ hashFiles('test-timings.xml') != '' }}
        with:
          junit-pattern: test-timings.xml
          artifact-name: test-timings-${{ matrix.python }}-${{ matrix.os }}
      # tests/test_tutorial.py owns the end-to-end tutorial and follows the file plan.
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles('coverage.xml') != '' }}
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording a completed execution of this job for this tested tree and selection.'
  pytest-minimum:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.11'
      - run: uv pip install 'pytest==8.0.0'
      - name: Execute the same file plan on minimum pytest
        run: uv run --no-sync python scripts/run_ci_tests.py -q -n 4 --durations=20
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording a completed execution of this job for this tested tree and selection.'
  distributions:
    needs: select-tests
    # The package lane includes the embedded README and LICENSE; planner failure must not skip it.
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).package) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/check_metadata.py
      - name: Smoke installed distributions when runtime inputs change
        if: >-
          ${{ needs.select-tests.result != 'success' ||
              fromJSON(needs.select-tests.outputs.planned).tests }}
        run: uv run --locked python scripts/smoke_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  selection-contract:
    name: Selection contract (Quint)
    needs: select-tests
    permissions:
      contents: read
      # The contract report's pull-request comment.
      pull-requests: write
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).contracts) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
      # pytest-quint-connect installs its locked Quint with npm on first use.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check the generated driver against the model
        run: uv run --locked --group quint pytest-quint-connect codegen --check contracts/selection/quint-connect.json
      - name: Generate histories from the model and replay them against the planner
        run: uv run --locked --group quint pytest -c contracts/selection/quint.ini contracts/selection --quint-require-complete -q
      # One updated PR comment, an artifact of every receipt and mismatch, and a check that the
      # README's contract block still matches the run.
      - uses: gigaverse-app/pytest-quint-connect/report@v1
        if: ${{ always() }}

  validation-gate:
    name: Validation gate
    needs: [select-tests, quality, tests, pytest-minimum, distributions, selection-contract]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"tests":["tests"],"pytest-minimum":["tests"],"distributions":["package"],"selection-contract":["contracts"]}'
