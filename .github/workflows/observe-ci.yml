name: CI observability

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  report:
    uses: gigaverse-app/ci-esta/.github/workflows/report.yml@68ca50420140e970b90fbd79147244fb7d57b070
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      pull-request-number: ${{ format('{0}', github.event.workflow_run.pull_requests[0].number || '') }}
      required-gates-json: '[{"kind":"actions_job","job_name":"quality"},{"kind":"actions_job","job_name":"pytest-minimum"},{"kind":"actions_job","job_name":"distributions"},{"kind":"actions_job","job_name":"tests (3.11, ubuntu-latest)"},{"kind":"actions_job","job_name":"tests (3.11, windows-latest)"},{"kind":"actions_job","job_name":"tests (3.11, macos-latest)"},{"kind":"actions_job","job_name":"tests (3.14, ubuntu-latest)"},{"kind":"actions_job","job_name":"tests (3.14, windows-latest)"},{"kind":"actions_job","job_name":"tests (3.14, macos-latest)"}]'
