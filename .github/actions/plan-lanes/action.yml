name: Select complete test lanes
description: Skip unaffected CI lanes while preserving complete conformance runs and full-suite fallbacks.
inputs:
  config:
    description: Repository-owned lane and dependency graph configuration.
    required: true
  base:
    description: Base commit containing the complete change set.
    required: true
  full:
    description: Run every lane for main, schedules, or an explicit full-test request.
    default: 'false'
  artifact-name:
    description: >
      Upload the lane plan under this name, where CI-esta's report renders it as
      the sticky's lane section. Empty skips the upload.
    default: test-lane-selection
outputs:
  lanes:
    description: JSON object mapping lane names to booleans.
    value: ${{ steps.plan.outputs.lanes }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - uses: actions/cache@v5
      continue-on-error: true
      with:
        path: .test-impact
        key: pytest-selective-lanes-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: pytest-selective-lanes-${{ runner.os }}-
    - id: plan
      shell: bash
      env:
        SELECTIVE_ACTION: ${{ github.action_path }}
        SELECTIVE_CONFIG: ${{ inputs.config }}
        SELECTIVE_BASE: ${{ inputs.base }}
        SELECTIVE_FULL: ${{ inputs.full }}
      run: |
        export PYTHONPATH="$SELECTIVE_ACTION/../../../src${PYTHONPATH:+:$PYTHONPATH}"
        args=(--config "$SELECTIVE_CONFIG" --base "$SELECTIVE_BASE" --github-output "$GITHUB_OUTPUT")
        if [ "$SELECTIVE_FULL" = true ]; then args+=(--full); fi
        uv run --no-project --python 3.14 --with pydantic==2.13.4 --with pyyaml==6.0.3 \
          python -m pytest_selective.ci "${args[@]}" | tee test-lanes.json
        {
          echo '### Test lane selection'
          echo '```json'
          cat test-lanes.json
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: test-lanes.json
        if-no-files-found: error
        # A rerun of the job replaces its plan instead of failing on the existing name.
        overwrite: true
