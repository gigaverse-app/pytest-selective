# Generated by scripts/public_actions.py; edit the canonical .github/actions metadata.
name: Cached test impact selection
description: Select affected Python test files from both Git trees, falling back to all configured roots.
inputs:
  warm-only:
    description: Populate the checked-out merged-tree cache without selecting or running tests.
    default: 'false'
  config:
    description: Consumer-owned dependency graph configuration.
    required: true
  base:
    description: Complete change-set base (a validated ancestor, PR base, or push before SHA).
    required: true
  head:
    description: Exact checked-out commit.
    default: HEAD
  full-roots:
    description: Space-separated complete test roots used if planning cannot prove a narrower scope.
    required: true
  full:
    description: Force the complete suite for schedules, explicit labels, or coverage checkpoints.
    default: 'false'
  extra-files:
    description: Optional newline file containing prior failure canaries or additional changed paths.
    default: ''
  alternate-base:
    description: 'A second proven base, normally the PR base when `base` is a previously validated tree. Both are selected
      and the smaller selection wins: after main is merged into a validated PR, the delta since that tree carries main''s
      own changes and can reach every test.'
    default: ''
  alternate-extra-files:
    description: Newline file of extra paths for `alternate-base` (its unresolved failures and canaries).
    default: ''
  minimum-files:
    description: Minimum nonempty selection for consumers with fixed shard counts.
    default: '0'
  max-shards:
    description: Maximum parallel pytest processes.
    default: '8'
  durations:
    description: pytest-split duration manifest used to size the shard pool; absent or unreadable falls back to file-count
      sizing.
    default: .test_durations
  shard-seconds:
    description: Target wall time per shard. Shard count is the selected work divided by this, bounded by max-shards.
    default: '120'
  dependency-token:
    description: Read access to the repositories of first-party packages declared in `first_party_packages`. With it, a lock
      change that only moves such a pin selects the tests reaching the modules that moved instead of every test. Without it,
      or when the fetch fails, lock changes stay global.
    default: ''
  explanation-artifact:
    description: Artifact name for why the selection is this large, which the ci-observability action renders into the PR
      sticky. Writing it never changes the selection. Empty skips the upload.
    default: test-impact-explanation
  graph-base:
    description: The PR's base commit. The explanation measures startup-floor and blast-radius changes from its merge base
      with `head`, so they stay visible after `base` moves to a validated tree. Without it, or without the history, they compare
      against `base`.
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  base:
    description: The base the selection was made from; `alternate-base` when it selected fewer tests.
    value: ${{ steps.action.outputs.base }}
  mode:
    description: full, scoped, or none.
    value: ${{ steps.action.outputs.mode }}
  test_roots:
    description: Exact selected files, or complete roots on fallback.
    value: ${{ steps.action.outputs.test_roots }}
  shard_count:
    description: Number of shards.
    value: ${{ steps.action.outputs.shard_count }}
  groups:
    description: JSON shard indexes.
    value: ${{ steps.action.outputs.groups }}
  reason:
    description: Selection summary.
    value: ${{ steps.action.outputs.reason }}
  dependencies-unchanged:
    description: '''true'' only when every declared first-party lock and manifest is unchanged, or differs only by pins whose
      installed files are byte-identical. Lanes that treat a lock change as "every runtime changed" may skip on it. ''false''
      on any doubt, including every fallback.'
    value: ${{ steps.action.outputs.dependencies-unchanged }}
runs:
  using: composite
  steps:
  - id: action
    uses: $/.github/actions/test-impact
    with:
      warm-only: ${{ inputs.warm-only }}
      config: ${{ inputs.config }}
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
      full-roots: ${{ inputs.full-roots }}
      full: ${{ inputs.full }}
      extra-files: ${{ inputs.extra-files }}
      alternate-base: ${{ inputs.alternate-base }}
      alternate-extra-files: ${{ inputs.alternate-extra-files }}
      minimum-files: ${{ inputs.minimum-files }}
      max-shards: ${{ inputs.max-shards }}
      durations: ${{ inputs.durations }}
      shard-seconds: ${{ inputs.shard-seconds }}
      dependency-token: ${{ inputs.dependency-token }}
      explanation-artifact: ${{ inputs.explanation-artifact }}
      graph-base: ${{ inputs.graph-base }}
